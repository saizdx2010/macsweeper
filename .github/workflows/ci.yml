name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: macOS unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme MacSweeper \
            -destination 'platform=macOS' \
            -quiet
